<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle</title>
    <link rel="stylesheet" href="css/2416501059.css">
    <script type="module" src="js/event_form.js"></script>
</head>
<body>

    <header>
        <h1 id="sayfa-baslik">Etkinlik Ekle</h1>
    </header>

    <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlikler.html">Etkinlikler</a>
        <a href="etkinlik_ekle.html">Ekle</a>
    </nav>

    <main>
        <p id="form-bilgi">Yıldızlı (*) alanlar zorunludur. Bu sprintte form veri kaydetmez; sonuç aşağıda gösterilir.</p>
        <form id="etkinlik-formu" data-mode="ekle" novalidate>
            <div class="alan">
                <label for="ad">Etkinlik Adı *</label>
                <input type="text" id="ad" name="ad" aria-describedby="ad-hata">
                <span class="alan-hata" id="ad-hata"></span>
            </div>
            <div class="alan">
                <label for="kategori">Kategori *</label>
                <select id="kategori" name="kategori" aria-describedby="kategori-hata">
                    <option value="">Seçiniz</option>
                    <option value="Seminer">Seminer</option>
                    <option value="Atölye">Atölye</option>
                    <option value="Söyleşi">Söyleşi</option>
                    <option value="Konser">Konser</option>
                    <option value="Spor">Spor</option>
                </select>
                <span class="alan-hata" id="kategori-hata"></span>
            </div>
            <div class="alan">
                <label for="tarih">Tarih *</label>
                <input type="date" id="tarih" name="tarih" aria-describedby="tarih-hata">
                <span class="alan-hata" id="tarih-hata"></span>
            </div>
            <div class="alan">
                <label for="saat">Saat *</label>
                <input type="time" id="saat" name="saat" aria-describedby="saat-hata">
                <span class="alan-hata" id="saat-hata"></span>
            </div>
            <div class="alan">
                <label for="yer">Yer *</label>
                <input type="text" id="yer" name="yer" placeholder="Örn. A Blok Konferans Salonu" aria-describedby="yer-hata">
                <span class="alan-hata" id="yer-hata"></span>
            </div>
            <div class="alan">
                <label for="kontenjan">Kontenjan</label>
                <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000" aria-describedby="kontenjan-hata">
                <span class="alan-hata" id="kontenjan-hata"></span>
            </div>
            <div class="alan">
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" rows="4"></textarea>
            </div>
            <button type="submit">Kaydet</button>
        </form>
        <div id="form-mesaj" class="mesaj" aria-live="polite"></div>
    </main>

    <footer>
        <p>Şeyma Ay · 2416501059 · 2026</p>
    </footer>

</body>
</html>
